}

function padR(str, len) {
  let w = 0;
  for (const ch of str) w += (ch.charCodeAt(0) > 255 ? 2 : 1);
  return str + " ".repeat(Math.max(1, len - w));
}

// ============================================================================
// 固定深度页面栈管理 (Bounded Stack: MAX_STACK_DEPTH = 8)
// ============================================================================
function curPage() {
  return app.stack[app.stack.length - 1];
}

function navPush(pageName) {
  if (curPage() === pageName) return;
  if (app.stack.length >= MAX_STACK_DEPTH) {
    app.stack.shift();
  }
  app.stack.push(pageName);
  if (pageName === "MallPage") app.mall.focusZone = "list";
  render();
}

function navPop() {
  if (app.stack.length > 1) {
    app.stack.pop();
  } else if (curPage() !== "LoginPage") {
    app.currentCustomer = null;
    app.currentAdmin = null;
    app.stack = ["LoginPage"];
  }
  render();
}

function navResetTo(pageName) {
  app.stack = [pageName];
  if (pageName === "MallPage") app.mall.focusZone = "list";
  render();
}

function jumpTo(target) {
  if (target === "LoginPage") {
    app.currentCustomer = null;
    app.currentAdmin = null;
    navResetTo("LoginPage");
  } else if (target === "Admin_Root") {
    app.currentAdmin = "root";
    app.currentCustomer = null;
    app.admin.msg = "已登录为 root (超级管理员)，拥有全部管理权限。";
    app.admin.isErr = false;
    navResetTo("AdminPage");
  } else if (target === "Admin_Staff") {
    app.currentAdmin = "staff";
    app.currentCustomer = null;
    app.admin.msg = "已登录为 staff (运营管理员)，修改用户等级、删除用户或重置系统将被权限控制拦截。";
    app.admin.isErr = false;
    navResetTo("AdminPage");
  } else {
    if (!app.currentCustomer) {
      app.currentCustomer = "demo";
      app.stack = ["MallPage"];
    }
    app.currentAdmin = null;
    if (target === "CheckoutPage" && app.cart.length === 0) {
      app.cart.push({ productId: "P1001", quantity: 1 });
      app.checkout.paidSuccess = false;
    }
    navPush(target);
  }
}

// ============================================================================
// 业务计算辅助函数
// ============================================================================
function getDayLabel() {
  return app.isWeekend ? "周六 (周末)" : "周三 (工作日)";
}

function getCartQty() {
  return app.cart.reduce((s, x) => s + x.quantity, 0);
}

function getCartCatTotal(cat) {
  let s = 0;
  for (const item of app.cart) {
    const p = app.products.find(x => x.id === item.productId);
    if (p && (cat === 0 || p.category === cat)) s += p.price * item.quantity;
  }
  return s;
}

function getCartTotal() {
  return getCartCatTotal(0);
}

function hasOwnedTemplate(cust, templateId) {
  return cust.coupons.some(c => !c.is_used && c.template_id === templateId);
}

function getRuleStr(c) {
  if (c.type === "THRESHOLD") return `满 ${c.min_spend.toFixed(2)} 减 ${c.reduce_amount.toFixed(2)}`;
  if (c.type === "DISCOUNT") {
    let s = `满 ${c.min_spend.toFixed(2)} 享 ${(c.discount_rate*10).toFixed(1)} 折`;
    if (c.max_discount > 0) s += ` (封顶 ${c.max_discount.toFixed(0)}元)`;
    return s;
  }
  return `无门槛立减 ${c.cash_amount.toFixed(2)}元`;
}

function getTypeName(c) {
  return c.type === "THRESHOLD" ? "满减券" : (c.type === "DISCOUNT" ? "折扣券" : "立减券");
}

function calcDiscount(c, amt) {
  if (amt + 1e-4 < c.min_spend) return 0;
  if (c.type === "THRESHOLD") return Math.min(c.reduce_amount, amt);
  if (c.type === "DISCOUNT") {
    let d = amt * (1 - c.discount_rate);
    if (c.max_discount > 0) d = Math.min(d, c.max_discount);
    return d;
  }
  return Math.min(c.cash_amount, amt);
}

function evalCoupon(c, userTier) {
  const base = getCartCatTotal(c.target_cat);
  if (c.is_used) return { ok: false, reason: "已使用", base, saving: 0, diff: 0 };
  if (c.min_tier > userTier) return { ok: false, reason: `等级不足(需${TIERS[c.min_tier].name})`, base, saving: 0, diff: 0 };
  if (c.time_limit === 1 && app.isWeekend) return { ok: false, reason: "仅限工作日使用", base, saving: 0, diff: 0 };
  if (c.time_limit === 2 && !app.isWeekend) return { ok: false, reason: "仅限周末使用", base, saving: 0, diff: 0 };
  if (base + 1e-4 < c.min_spend) {
    const diff = c.min_spend - base;
    return { ok: false, reason: `差 ¥${diff.toFixed(2)} 达标`, base, saving: 0, diff };
  }
  return { ok: true, reason: "可用", base, saving: calcDiscount(c, base), diff: 0 };
}

function sortUserCoupons(cust) {
  const avail = cust.coupons.filter(x => !x.is_used);
  let bestId = null, bestVal = 0;
  for (const c of avail) {
    const ev = evalCoupon(c, cust.tier);
    if (ev.ok && ev.saving > bestVal) {
      bestVal = ev.saving;
      bestId = c.instance_id;
    }
  }
  const okList = [], failList = [];
  for (const c of avail) {
    const ev = evalCoupon(c, cust.tier);
    const item = { coupon: c, ev, isBest: (c.instance_id === bestId && bestVal > 0) };
    if (ev.ok) okList.push(item);
    else failList.push(item);
  }
  okList.sort((a, b) => (a.isBest !== b.isBest) ? (a.isBest ? -1 : 1) : (b.ev.saving - a.ev.saving));
  return [...okList, ...failList];
}

    return `<button onclick="navPush('${item.page}')" class="${isAct ? 'term-btn-active-tab' : 'term-btn'}">[ ${item.label} ]</button>`;
  }).join(" ");

  return `
    <div class="term-box p-2.5 mb-2 space-y-1.5">
      <div class="term-box-title">系统状态与全局导航</div>
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-zinc-800 pb-1.5">
        <div class="flex flex-wrap items-center gap-4">
          <span>当前用户: <strong class="text-white">${cust.username}</strong></span>
          <span>会员等级: <strong class="text-amber-400">${tCfg.code} ${tCfg.name} (${discountText})</strong></span>
          <span>账户余额: <strong class="text-emerald-400">¥${cust.balance.toFixed(2)}</strong></span>
          <span>可用卡券: <strong class="text-sky-400">${unusedCount} 张</strong></span>
        </div>
        <div class="flex items-center gap-3">
          <span>系统星期: <strong class="${app.isWeekend ? 'text-amber-400' : 'text-zinc-200'}">${getDayLabel()}</strong></span>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="text-zinc-400 mr-1">页面跳转:</span>
          ${navBtns}
          ${prevPage ? `
            <button onclick="navPop()" class="term-btn text-sky-300 border-sky-600">[ ◀ 返回:${pageCnMap[prevPage] || prevPage}(Esc) ]</button>
          ` : ''}
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="app.isWeekend=!app.isWeekend;render()" class="term-btn">[ 切换工作日/周末(T) ]</button>
          <button onclick="app.currentCustomer=null;navResetTo('LoginPage')" class="term-btn">[ 退出登录 ]</button>
        </div>
      </div>
    </div>
  `;
}

  const prefix = isErr ? "[错误]" : "[提示]";
  return `
    <div class="term-box px-3 py-1.5 mt-2 flex flex-wrap items-center justify-between gap-2">
      <div class="${statusColor}"><strong>${prefix}</strong> ${msg}</div>
      <div class="text-zinc-500">${keyHints}</div>
    </div>
  `;
}

function fillAccount(u, p) {
  app.login.user = u;
  app.login.pass = p;
  app.login.msg = `已填入账号 ${u}。`;
  app.login.isErr = false;
  render();
}

function handleCustomerLogin() {
  const { user, pass } = app.login;
  const c = app.customers[user];
  if (!c) { app.login.msg = "消费者账号不存在"; app.login.isErr = true; return render(); }
  if (c.password !== pass) { app.login.msg = "密码错误"; app.login.isErr = true; return render(); }
  app.currentCustomer = user;
  app.currentAdmin = null;
  app.cart = [];
  app.mall.focusZone = "list";
  app.mall.selectedIdx = 0;
  app.mall.msg = `欢迎回来，${user}。当前默认焦点位于左侧【商品货架列表】。`;
  app.mall.isErr = false;
  navResetTo("MallPage");
}

function handleCustomerReg() {
  const { user, pass } = app.login;
  if (!user || !pass) { app.login.msg = "用户名和密码不能为空"; app.login.isErr = true; return render(); }
  if (app.customers[user] || app.admins[user]) { app.login.msg = "该用户名已存在"; app.login.isErr = true; return render(); }
  app.customers[user] = {
    username: user, password: pass, created_at: nowStr(),
    balance: 1000.0, total_spent: 0.0, tier: 0,
    coupons: [],
    transactions: [`[账户充值] ${nowStr()} +¥1000.00（渠道：新用户注册初始资金）`]
  };
  app.login.msg = `账号 ${user} 注册成功（初始余额 ¥1000.00），请点击 [ 消费者登录 ]。`;
  app.login.isErr = false;
  render();
}

function handleAdminLogin() {
  const { user, pass } = app.login;
  const a = app.admins[user];
  if (!a || a.password !== pass) { app.login.msg = "管理员账号不存在或密码错误"; app.login.isErr = true; return render(); }
  app.currentAdmin = user;
  app.currentCustomer = null;
  navResetTo("AdminPage");
}

  const m = app.mall;

    const cOk = (m.catFilter === 0 || p.category === m.catFilter);
    const sOk = (!m.search || p.name.includes(m.search) || p.id.includes(m.search));
    return cOk && sOk;
  });
}

function mallAddToCart() {
  const list = getMallProducts();
  const selP = list[app.mall.selectedIdx];
  if (!selP) return;
  const qty = app.mall.addQty;
  const exist = app.cart.find(x => x.productId === selP.id);
  const cur = exist ? exist.quantity : 0;

  if (cur + qty > selP.stock) {
    app.mall.msg = `无法加购：${selP.name} 库存不足 (剩余库存 ${selP.stock}，已加购 ${cur})。`;
    app.mall.isErr = true;
    return render();
  }
  if (exist) exist.quantity += qty;
  else app.cart.push({ productId: selP.id, quantity: qty });

  app.mall.msg = `已将 ${selP.name} x${qty} 加入购物车。当前购物车共 ${getCartQty()} 件，合计 ¥${getCartTotal().toFixed(2)}。`;
  app.mall.isErr = false;
  render();
}

function cartModQty(d) {
  const it = app.cart[app.cartPage.selectedIdx];
  if (!it) return;
  const p = app.products.find(x => x.id === it.productId);
  if (d > 0 && it.quantity + d > p.stock) {
    app.cartPage.msg = `库存不足：${p.name} 库存仅 ${p.stock} 件。`;
    app.cartPage.isErr = true;
    return render();
  }
  it.quantity += d;
  if (it.quantity <= 0) {
    app.cart.splice(app.cartPage.selectedIdx, 1);
    app.cartPage.msg = `已移除商品 ${p.name}。`;
  } else {
    app.cartPage.msg = `已将 ${p.name} 数量调整为 ${it.quantity}。`;
  }
  app.cartPage.isErr = false;
  render();
}

function cartRemove() {
  const it = app.cart[app.cartPage.selectedIdx];
  if (!it) return;
  app.cart.splice(app.cartPage.selectedIdx, 1);
  app.cartPage.msg = "已移除选中商品。";
  app.cartPage.isErr = false;
  render();
}

function cartClear() {
  app.cart = [];
  app.cartPage.msg = "已清空购物车。";
  app.cartPage.isErr = false;
  render();
}

function enterCheckout() {
  if (app.cart.length === 0) {
    app.cartPage.msg = "购物车为空，请先去商城添加商品后再结算。";
    app.cartPage.isErr = true;
    return render();
  }
  app.checkout.selectedIdx = 0;
  app.checkout.paidSuccess = false;
  app.checkout.msg = "已自动运行最优单券规划算法，默认选中最省钱方案。";
  app.checkout.isErr = false;
  navPush("CheckoutPage");
}

// ============================================================================
// 4. CheckoutPage (结算与最优优惠券规划页 —— 展示 applicable_amount 与 shortfall_amount)
// ============================================================================
function renderCheckoutPage() {
  const cust = app.customers[app.currentCustomer];
  const tCfg = TIERS[cust.tier];
  const ck = app.checkout;
  const sorted = sortUserCoupons(cust);

  const originTotal = getCartTotal();
  const memberSaving = originTotal * (1 - tCfg.rate);

  let chosenCoupon = null;
  let chosenEv = null;
  let inspectCoupon = null;
  if (ck.selectedIdx === 0) {
    const best = sorted.find(x => x.isBest);
    if (best) { chosenCoupon = best.coupon; chosenEv = best.ev; inspectCoupon = best.coupon; }
  } else if (ck.selectedIdx >= 2) {
    const item = sorted[ck.selectedIdx - 2];
    if (item) {
      inspectCoupon = item.coupon;
      chosenEv = item.ev;
      if (item.ev.ok) chosenCoupon = item.coupon;
    }
  }

  const rawCpnSaving = (chosenCoupon && chosenEv && chosenEv.ok) ? chosenEv.saving : 0;
  const cpnSaving = Math.min(rawCpnSaving, Math.max(0, originTotal - memberSaving));
  const finalPay = Math.max(0, originTotal - memberSaving - cpnSaving);

  const bestItem = sorted.find(x => x.isBest);
  const opt0Label = bestItem
    ? `[自动最优推荐] ${bestItem.coupon.name} (立减 ¥${bestItem.ev.saving.toFixed(2)})`
    : `[自动最优推荐] 当前无可用优惠券`;

  let listHtml = `
    <div onclick="app.checkout.selectedIdx=0;render()" class="term-row ${ck.selectedIdx===0?'selected':''}">${ck.selectedIdx===0?'> ':'  '}${opt0Label}</div>
    <div onclick="app.checkout.selectedIdx=1;render()" class="term-row ${ck.selectedIdx===1?'selected':''}">${ck.selectedIdx===1?'> ':'  '}[不使用优惠券] 仅享受会员等级折扣</div>
  `;

  if (sorted.length === 0) {
    listHtml += `<div class="px-3 py-2 text-zinc-500">  (背包中暂无优惠券，可点击右侧 [ 去领券 ] 领取后再按 Esc 返回)</div>`;
  } else {
    sorted.forEach((item, i) => {
      const idx = i + 2;
      const isSel = ck.selectedIdx === idx;
      const c = item.coupon;
      const tag = item.ev.ok ? (item.isBest ? "[推荐]" : "[可用]") : "[不可用]";
      const rightTxt = item.ev.ok ? `-¥${item.ev.saving.toFixed(2)}` : `[${item.ev.reason}]`;
      const line = `${isSel?'> ':'  '}${padR(tag, 9)}${padR(c.name, 22)}${padR(getRuleStr(c), 20)}${rightTxt}`;
      listHtml += `<div onclick="app.checkout.selectedIdx=${idx};render()" class="term-row ${isSel?'selected':''} ${!item.ev.ok && !isSel ? 'text-zinc-500' : ''}">${line}</div>`;
    });
  }

  return `
    ${renderCustomerHeader("CheckoutPage")}

    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 flex-1">
      <div class="md:col-span-7 term-box-focused p-2.5 flex flex-col">
        <div class="term-box-title">优惠券方案选择与四维诊断 (当前焦点)</div>
        <div class="text-zinc-400 border-b border-zinc-800 pb-1 px-2 whitespace-pre">  状态     券名称                规则说明            诊断结果/抵扣额</div>
        <div class="flex-1 overflow-y-auto max-h-[320px] divide-y divide-zinc-900 pt-1">
          ${listHtml}
        </div>
      </div>

      <div class="md:col-span-5 term-box p-3 flex flex-col justify-between">
        <div class="term-box-title">收银台账单明细</div>
        <div class="space-y-1.5 pt-1">
          <div class="flex justify-between"><span class="text-zinc-400">订单商品原价总额:</span><span>¥${originTotal.toFixed(2)}</span></div>
          <div class="flex justify-between text-emerald-400">
            <span>会员等级让利 (${tCfg.name}):</span>
            <span>- ¥${memberSaving.toFixed(2)}</span>
          </div>
          <div class="flex justify-between text-emerald-400">
            <span>优惠券抵扣 (${chosenCoupon ? chosenCoupon.name : '未使用'}):</span>
            <span>- ¥${cpnSaving.toFixed(2)}</span>
          </div>
          ${inspectCoupon && chosenEv ? `

function executePay(finalPay, instId) {
  const cust = app.customers[app.currentCustomer];
  if (cust.balance + 1e-4 < finalPay) {
    app.checkout.msg = `支付失败：余额不足 (需 ¥${finalPay.toFixed(2)}，当前 ¥${cust.balance.toFixed(2)})。请点击右下方 [ 去充值 ]。`;
    app.checkout.isErr = true;
    return render();
  }
  for (const it of app.cart) {
    const p = app.products.find(x => x.id === it.productId);
    if (!p || p.stock < it.quantity) {
      app.checkout.msg = `支付失败：商品 ${p ? p.name : it.productId} 库存不足。`;
      app.checkout.isErr = true;
      return render();
    }
  }
  for (const it of app.cart) {
    const p = app.products.find(x => x.id === it.productId);
    p.stock -= it.quantity;
  }
  cust.balance = Math.max(0, cust.balance - finalPay);
  cust.total_spent += finalPay;
  const ordId = `ORD_${++app.ordSeq}`;
  cust.transactions.unshift(`[购物消费] ${nowStr()} -¥${finalPay.toFixed(2)}（订单号：${ordId}，摘要：购买商品结算）`);

  if (instId) {
    const c = cust.coupons.find(x => x.instance_id === instId);
    if (c) c.is_used = true;
  }

  const oldTier = cust.tier;
  let newTier = oldTier;
  for (let t = oldTier + 1; t <= 5; t++) {
    if (cust.total_spent + 1e-4 >= TIERS[t].threshold) newTier = t;
  }
  let upStr = "";
  if (newTier > oldTier) {
    cust.tier = newTier;
    cust.transactions.unshift(`[等级跃迁] ${nowStr()} 会员跃迁：${TIERS[oldTier].name} -> ${TIERS[newTier].name}`);
    upStr = ` 恭喜晋升为【${TIERS[newTier].name}】！`;
  }

  app.cart = [];
  app.checkout.paidSuccess = true;
  app.checkout.msg = `订单 ${ordId} 支付成功 (实付 ¥${finalPay.toFixed(2)})！${upStr}`;
  app.checkout.isErr = false;
  render();
}

  const cust = app.customers[app.currentCustomer];

  if (f === 1) return app.couponPool.filter(c => c.cost <= 1e-4);
  if (f === 2) return app.couponPool.filter(c => c.cost > 1e-4);
  if (f === 3) return app.couponPool.filter(c => c.min_tier <= cust.tier);
  return app.couponPool;
}

function claimOrBuySingle() {
  const cust = app.customers[app.currentCustomer];
  const list = getFilteredCoupons();
  const selC = list[app.couponSquare.selectedIdx];
  if (!selC) return;

  if (hasOwnedTemplate(cust, selC.template_id)) {
    app.couponSquare.msg = `操作失败：您已拥有【${selC.name}】(${selC.template_id})，每种优惠券限持有一张。`;
    app.couponSquare.isErr = true;
    return render();
  }

  if (cust.tier < selC.min_tier) {
    app.couponSquare.msg = `操作失败：需要达到【${TIERS[selC.min_tier].name}】才可获取该券。`;
    app.couponSquare.isErr = true;
    return render();
  }

  if (selC.cost > 0) {
    if (cust.balance + 1e-4 < selC.cost) {
      app.couponSquare.msg = `购买失败：余额不足 (需 ¥${selC.cost.toFixed(2)})，请先前往个人中心充值。`;
      app.couponSquare.isErr = true;
      return render();
    }
    cust.balance -= selC.cost;
    cust.transactions.unshift(`[购券支出] ${nowStr()} -¥${selC.cost.toFixed(2)}（购买优惠券：${selC.name}，模板ID：${selC.template_id}）`);
  }

  const instId = `INST_${++app.instSeq}`;
  cust.coupons.push({ ...selC, instance_id: instId, is_used: false });
  app.couponSquare.msg = `获取成功：已生成优惠券实例 [${instId}] 存入个人卡券包。`;
  app.couponSquare.isErr = false;
  render();
}

function claimAllFreeCoupons() {
  const cust = app.customers[app.currentCustomer];
  const freeList = app.couponPool.filter(c => c.cost <= 1e-4);
  let claimed = 0, skippedOwned = 0, skippedTier = 0;

  for (const c of freeList) {
    if (hasOwnedTemplate(cust, c.template_id)) {
      skippedOwned++;
      continue;
    }
    if (cust.tier < c.min_tier) {
      skippedTier++;
      continue;
    }
    const instId = `INST_${++app.instSeq}`;
    cust.coupons.push({ ...c, instance_id: instId, is_used: false });
    claimed++;
  }

  if (claimed > 0) {
    app.couponSquare.msg = `一键领取成功：新领取 ${claimed} 张免费优惠券 (跳过已拥有 ${skippedOwned} 张，等级不符 ${skippedTier} 张)。`;
    app.couponSquare.isErr = false;
  } else {
    app.couponSquare.msg = `无可新领的免费券 (已全部拥有 ${skippedOwned} 张，等级不符 ${skippedTier} 张)。`;
    app.couponSquare.isErr = true;
  }
  render();
}

function userRecharge(amt) {
  if (amt <= 0) {
    app.userCenter.msg = "充值金额必须大于 0。";
    app.userCenter.isErr = true;
    return render();
  }
  const cust = app.customers[app.currentCustomer];
  cust.balance += amt;
  cust.transactions.unshift(`[账户充值] ${nowStr()} +¥${amt.toFixed(2)}（渠道：个人中心充值）`);
  app.userCenter.msg = `充值成功：已到账 +¥${amt.toFixed(2)}，当前最新余额 ¥${cust.balance.toFixed(2)}。`;
  app.userCenter.isErr = false;
  render();
}

function cleanUsedCoupons() {
  const cust = app.customers[app.currentCustomer];
  const before = cust.coupons.length;
  cust.coupons = cust.coupons.filter(x => !x.is_used);
  app.userCenter.msg = `已清理 ${before - cust.coupons.length} 张已核销优惠券。`;
  app.userCenter.isErr = false;
  render();
}

      return `<div onclick="app.admin.prodIdx=${idx};app.admin.priceMod=String(app.products[${idx}].price);render()" class="term-row ${isSel?'selected':''}">${line}</div>`;
    }).join("");

    const newProdCats = [1,2,3,4,5].map(cid => `
      <span onclick="app.admin.newCat=${cid};render()" class="cursor-pointer mr-2 ${ad.newCat===cid?'text-sky-400 font-bold':'text-zinc-400'}">${ad.newCat===cid?'(•)':'( )'}${CATS_SHORT[cid]}</span>
    `).join("");

    bodyHtml = `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 flex-1">
        <div class="md:col-span-7 term-box-focused p-2.5 flex flex-col">
          <div class="term-box-title">系统商品列表 (当前焦点)</div>
          <div class="overflow-y-auto max-h-[330px] pt-1">${rows}</div>
        </div>
        <div class="md:col-span-5 space-y-3">
          <div class="term-box p-3 space-y-2">
            <div class="term-box-title">维护选中商品: ${selP ? selP.name : ''}</div>
            <div class="flex flex-wrap items-center justify-between gap-1 pt-1">
              <span>数量: <input type="number" value="${ad.stockVal}" oninput="app.admin.stockVal=this.value" class="term-input w-14" /></span>
              <button onclick="admReplenish()" class="term-btn">[ +补货 ]</button>
              <button onclick="admSetStock()" class="term-btn">[ 设库存 ]</button>
              <button onclick="admDelProd()" class="term-btn">[ 下架 ]</button>
            </div>
            <div class="flex items-center justify-between border-t border-zinc-800 pt-2">
              <span>修改单价: <input type="number" value="${ad.priceMod}" oninput="app.admin.priceMod=this.value" class="term-input w-20" /></span>
              <button onclick="admModPrice()" class="term-btn">[ 更新单价 ]</button>
            </div>
          </div>

          <div class="term-box p-3 space-y-2">
            <div class="term-box-title">上架新商品</div>
            <div class="pt-1 text-zinc-400">分类: ${newProdCats}</div>
            <div class="grid grid-cols-2 gap-2">
              <div>编号: <input type="text" value="${ad.newId}" oninput="app.admin.newId=this.value" class="term-input w-24" /></div>
              <div>名称: <input type="text" value="${ad.newName}" oninput="app.admin.newName=this.value" class="term-input w-24" /></div>
              <div>单价: <input type="number" value="${ad.newPrice}" oninput="app.admin.newPrice=this.value" class="term-input w-20" /></div>
              <div>库存: <input type="number" value="${ad.newStock}" oninput="app.admin.newStock=this.value" class="term-input w-20" /></div>
            </div>
            <button onclick="admAddProd()" class="term-btn focused w-full text-center mt-1">[ + 上架新商品至商城 ]</button>
          </div>
        </div>
      </div>
    `;
  } else if (ad.tab === 1) {
    const rows = app.couponPool.map((c, idx) => {
      const isSel = idx === ad.cpnIdx;
      const line = `${isSel?'> ':'  '}${padR(c.template_id, 24)}${padR(c.name, 20)}${getRuleStr(c)}`;
      return `<div onclick="app.admin.cpnIdx=${idx};render()" class="term-row ${isSel?'selected':''}">${line}</div>`;
    }).join("");

    bodyHtml = `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 flex-1">
        <div class="md:col-span-7 term-box-focused p-2.5 flex flex-col justify-between">
          <div class="term-box-title">公共池优惠券模板</div>
          <div class="overflow-y-auto max-h-[290px] pt-1">${rows}</div>
          <div class="border-t border-zinc-800 pt-2">
            <button onclick="admDelCpn()" class="term-btn">[ 下架移除选中券模板 ]</button>
          </div>
        </div>
        <div class="md:col-span-5 term-box p-3 flex flex-col justify-between">
          <div class="term-box-title">发布新优惠券模板 (四维约束配置)</div>
          <div class="space-y-1.5 pt-1">
            <div>
              <span class="text-zinc-400">券种:</span>
              ${["满减券", "折扣券", "立减券"].map((n, i) => `
                <span onclick="app.admin.cType=${i};render()" class="cursor-pointer mr-2 ${ad.cType===i?'text-sky-400 font-bold':'text-zinc-400'}">${ad.cType===i?'(•)':'( )'}${n}</span>
              `).join("")}
            </div>
            <div>
              <span class="text-zinc-400">品类:</span>
              ${CATS_SHORT.map((n, i) => `
                <span onclick="app.admin.cCat=${i};render()" class="cursor-pointer mr-1.5 ${ad.cCat===i?'text-sky-400 font-bold':'text-zinc-400'}">${ad.cCat===i?'(•)':'( )'}${n}</span>
              `).join("")}
            </div>
            <div>
              <span class="text-zinc-400">最低等级:</span>
              ${TIERS.map((t, i) => `
                <span onclick="app.admin.cTier=${i};render()" class="cursor-pointer mr-1.5 ${ad.cTier===i?'text-sky-400 font-bold':'text-zinc-400'}">${ad.cTier===i?'(•)':'( )'}${t.code}</span>
              `).join("")}
            </div>
            <div>
              <span class="text-zinc-400">时间限制:</span>
              ${TIMES.map((n, i) => `
                <span onclick="app.admin.cTime=${i};render()" class="cursor-pointer mr-2 ${ad.cTime===i?'text-sky-400 font-bold':'text-zinc-400'}">${ad.cTime===i?'(•)':'( )'}${n}</span>
              `).join("")}
            </div>
            <div class="grid grid-cols-2 gap-1.5 border-t border-zinc-800 pt-1.5">
              <div>模板ID: <input type="text" value="${ad.cId}" oninput="app.admin.cId=this.value" class="term-input w-24" /></div>
              <div>券名称: <input type="text" value="${ad.cName}" oninput="app.admin.cName=this.value" class="term-input w-24" /></div>
              <div>购券费: <input type="number" value="${ad.cCost}" oninput="app.admin.cCost=this.value" class="term-input w-20" /></div>
              <div>门槛额: <input type="number" value="${ad.cMin}" oninput="app.admin.cMin=this.value" class="term-input w-20" /></div>
              <div>减免/折扣: <input type="number" value="${ad.cVal}" oninput="app.admin.cVal=this.value" class="term-input w-16" /></div>
              <div>封顶额: <input type="number" value="${ad.cMax}" oninput="app.admin.cMax=this.value" class="term-input w-16" /></div>
            </div>
          </div>
          <button onclick="admAddCpn()" class="term-btn focused w-full text-center mt-2">[ + 发布至公共领券中心 ]</button>
        </div>
      </div>
    `;
  } else {
    const custs = Object.values(app.customers);
    if (ad.userIdx >= custs.length) ad.userIdx = Math.max(0, custs.length - 1);
    const selU = custs[ad.userIdx];
    const rows = custs.map((u, idx) => {
      const isSel = idx === ad.userIdx;
      const line = `${isSel?'> ':'  '}${padR(u.username, 12)}${padR(TIERS[u.tier].name, 12)}${padR("余额:¥"+u.balance.toFixed(2), 18)}累计消费:¥${u.total_spent.toFixed(2)}`;
      return `<div onclick="app.admin.userIdx=${idx};render()" class="term-row ${isSel?'selected':''}">${line}</div>`;
    }).join("");

    bodyHtml = `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 flex-1">
        <div class="md:col-span-7 term-box-focused p-2.5 flex flex-col">
          <div class="term-box-title">注册消费者列表 (当前焦点)</div>
          <div class="overflow-y-auto max-h-[320px] pt-1">${rows}</div>
        </div>
        <div class="md:col-span-5 term-box p-3 flex flex-col justify-between">
          <div class="term-box-title">用户账户维护与等级调控 (RBAC)</div>
          ${selU ? `
            <div class="space-y-2.5 pt-1">
              <div>目标用户: <strong class="text-white">${selU.username}</strong> (当前: <span class="text-amber-400">${TIERS[selU.tier].name}</span>)</div>
              <div class="space-y-1">
                <div class="text-zinc-400">选择新等级:</div>
                <div class="grid grid-cols-2 gap-1.5">
                  ${TIERS.map(t => `
                    <span onclick="app.admin.targetTier=${t.tier};render()" class="cursor-pointer ${ad.targetTier===t.tier?'text-sky-400 font-bold':'text-zinc-400'}">
                      ${ad.targetTier===t.tier?'(•)':'( )'} ${t.code} ${t.name}
                    </span>
                  `).join("")}
                </div>
              </div>
              <div class="border-t border-zinc-800 pt-2 text-zinc-400">
                当前管理员权限: <strong class="${isSuper ? 'text-emerald-400' : 'text-red-400'}">${adm.roleName} (${isSuper ? '允许调级/删号' : '仅只读查看'})</strong>
              </div>
            </div>
            <div class="space-y-1.5">
              <button onclick="admModTier()" class="term-btn focused w-full text-center">[ 执行等级修改 ]</button>
              <button onclick="admDelCustomer()" class="term-btn w-full text-center">[ 删除选中消费者账号 ]</button>
            </div>
          ` : `<div class="text-zinc-500">暂无消费者账号</div>`}
        </div>
      </div>
    `;
  }

  return `
    <div class="term-box p-2.5 mb-2 flex flex-wrap items-center justify-between gap-2">
      <div class="term-box-title">后台运营控制台 (AdminPage)</div>
      <div class="flex flex-wrap items-center gap-2 pt-0.5">
        <span class="mr-2">管理员: <strong class="text-amber-400">${adm.username} [${adm.roleName}]</strong></span>
        ${tabs}
      </div>
      <div class="flex items-center gap-1.5 pt-0.5">
        <button onclick="admResetData()" class="term-btn">[ 重置系统默认数据 ]</button>
        <button onclick="app.currentAdmin=null;navResetTo('LoginPage')" class="term-btn">[ 退出后台(Esc) ]</button>
      </div>
    </div>

    ${bodyHtml}

    ${renderFooterBar(ad.msg, ad.isErr, "1/2/3 切换管理模块 | ↑/↓ 选择条目 | Esc 退出后台")}
  `;
}

function admReplenish() {
  const p = app.products[app.admin.prodIdx];
  const n = parseInt(app.admin.stockVal) || 0;
  if (!p || n <= 0) return;
  p.stock += n;
  app.admin.msg = `已为 ${p.name} 补货 +${n} 件，当前库存 ${p.stock} 件。`;
  app.admin.isErr = false;
  render();
}

function admSetStock() {
  const p = app.products[app.admin.prodIdx];
  const n = parseInt(app.admin.stockVal);
  if (!p || isNaN(n) || n < 0) return;
  p.stock = n;
  app.admin.msg = `已将 ${p.name} 库存直接设置为 ${p.stock} 件。`;
  app.admin.isErr = false;
  render();
}

function admModPrice() {
  const p = app.products[app.admin.prodIdx];
  const v = parseFloat(app.admin.priceMod) || 0;
  if (!p || v <= 0) return;
  p.price = v;
  app.admin.msg = `已将 ${p.name} 单价修改为 ¥${v.toFixed(2)}。`;
  app.admin.isErr = false;
  render();
}

function admDelProd() {
  const p = app.products[app.admin.prodIdx];
  if (!p) return;
  app.products.splice(app.admin.prodIdx, 1);
  app.admin.msg = `已下架商品 ${p.name}。`;
  app.admin.isErr = false;
  render();
}

function admAddProd() {
  const ad = app.admin;
  if (app.products.some(x => x.id === ad.newId)) {
    ad.msg = `添加失败：商品编号 ${ad.newId} 已存在。`;
    ad.isErr = true;
    return render();
  }
  app.products.push({
    id: ad.newId, name: ad.newName, category: ad.newCat,
    price: parseFloat(ad.newPrice) || 99, stock: parseInt(ad.newStock) || 10
  });
  ad.msg = `已成功上架新商品 [${ad.newId}] ${ad.newName} (${CATS[ad.newCat]})。`;
  ad.isErr = false;
  render();
}

function admDelCpn() {
  const c = app.couponPool[app.admin.cpnIdx];
  if (!c) return;
  app.couponPool.splice(app.admin.cpnIdx, 1);
  app.admin.msg = `已从公共池移除优惠券模板 ${c.name}。`;
  app.admin.isErr = false;
  render();
}

function admAddCpn() {
  const ad = app.admin;
  const types = ["THRESHOLD", "DISCOUNT", "CASH"];
  app.couponPool.push({
    template_id: ad.cId, name: ad.cName, type: types[ad.cType],
    cost: parseFloat(ad.cCost) || 0, min_spend: parseFloat(ad.cMin) || 0,
    target_cat: ad.cCat, min_tier: ad.cTier, time_limit: ad.cTime,
    reduce_amount: parseFloat(ad.cVal) || 30,
    discount_rate: parseFloat(ad.cVal) || 0.85,
    max_discount: parseFloat(ad.cMax) || 0,
    cash_amount: parseFloat(ad.cVal) || 10
  });
  ad.msg = `已发布优惠券模板 ${ad.cName} 至公共池。`;
  ad.isErr = false;
  render();
}

function admModTier() {
  const adm = app.admins[app.currentAdmin];
  if (adm.role !== "SUPER_ADMIN") {
    app.admin.msg = "权限不足：当前为运营管理员(STAFF)，仅超级管理员(SUPER_ADMIN)可修改用户等级。";
    app.admin.isErr = true;
    return render();
  }
  const custs = Object.values(app.customers);
  const u = custs[app.admin.userIdx];
  if (!u) return;
  const oldN = TIERS[u.tier].name;
  const newN = TIERS[app.admin.targetTier].name;
  u.tier = app.admin.targetTier;
  u.transactions.unshift(`[等级跃迁] ${nowStr()} 会员跃迁：${oldN} -> ${newN}`);
  app.admin.msg = `已将用户 ${u.username} 的等级修改为 ${newN}。`;
  app.admin.isErr = false;
  render();
}

function admDelCustomer() {
  const adm = app.admins[app.currentAdmin];
  if (adm.role !== "SUPER_ADMIN") {
    app.admin.msg = "权限不足：仅超级管理员可删除消费者账号。";
    app.admin.isErr = true;
    return render();
  }
  const custs = Object.values(app.customers);
  const u = custs[app.admin.userIdx];
  if (!u) return;
  delete app.customers[u.username];
  app.admin.msg = `已删除消费者账号 ${u.username}。`;
  app.admin.isErr = false;
  render();
}

function admResetData() {
  const adm = app.admins[app.currentAdmin];
  if (adm.role !== "SUPER_ADMIN") {
    app.admin.msg = "权限不足：仅超级管理员可重置系统数据。";
    app.admin.isErr = true;
    return render();
  }
  resetAll();
  app.currentAdmin = "root";
  app.stack = ["AdminPage"];
  app.admin.msg = "系统数据已恢复为出厂默认状态。";
  app.admin.isErr = false;
  render();
}

function render() {
  const p = curPage();
  document.getElementById("stack-indicator").textContent = `${app.stack.join(" > ")} (${app.stack.length}/${MAX_STACK_DEPTH})`;

  const pIds = ["LoginPage", "MallPage", "CartPage", "CheckoutPage", "CouponSquarePage", "UserCenterPage", "Admin_Root", "Admin_Staff"];
  pIds.forEach(id => {
    const btn = document.getElementById("preview-" + id);
    if (!btn) return;
    const match = (p === id) ||
      (p === "AdminPage" && id === "Admin_Root" && app.currentAdmin === "root") ||
      (p === "AdminPage" && id === "Admin_Staff" && app.currentAdmin === "staff");
    btn.className = match
      ? "px-2 py-1 rounded bg-sky-600 text-white font-semibold"
      : "px-2 py-1 rounded border border-[var(--border)] hover:opacity-80";
  });

  const root = document.getElementById("tui-root");
  if (p === "LoginPage") root.innerHTML = renderLoginPage();
  else if (p === "MallPage") root.innerHTML = renderMallPage();
  else if (p === "CartPage") root.innerHTML = renderCartPage();
  else if (p === "CheckoutPage") root.innerHTML = renderCheckoutPage();
  else if (p === "CouponSquarePage") root.innerHTML = renderCouponSquarePage();
  else if (p === "UserCenterPage") root.innerHTML = renderUserCenterPage();
  else if (p === "AdminPage") root.innerHTML = renderAdminPage();
}

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  const p = curPage();
  if (e.key === "Escape") {
    e.preventDefault();
    navPop();
    return;
  }

  if (["MallPage", "CartPage", "CouponSquarePage", "UserCenterPage", "CheckoutPage"].includes(p)) {
    if (e.key === "1") return navPush("MallPage");
    if (e.key === "2") return navPush("CartPage");
    if (e.key === "3") return navPush("CouponSquarePage");
    if (e.key === "4") return navPush("UserCenterPage");
    if (e.key === "t" || e.key === "T") { app.isWeekend = !app.isWeekend; return render(); }
  }

  if (p === "MallPage") {
    const list = getMallProducts();
    if (e.key === "ArrowDown") { e.preventDefault(); app.mall.selectedIdx = Math.min(list.length - 1, app.mall.selectedIdx + 1); render(); }
    if (e.key === "ArrowUp")   { e.preventDefault(); app.mall.selectedIdx = Math.max(0, app.mall.selectedIdx - 1); render(); }
    if (e.key === "Enter")     { e.preventDefault(); mallAddToCart(); }
  } else if (p === "CartPage") {
    if (e.key === "ArrowDown") { e.preventDefault(); app.cartPage.selectedIdx = Math.min(Math.max(0, app.cart.length - 1), app.cartPage.selectedIdx + 1); render(); }
    if (e.key === "ArrowUp")   { e.preventDefault(); app.cartPage.selectedIdx = Math.max(0, app.cartPage.selectedIdx - 1); render(); }
    if (e.key === "+")         { e.preventDefault(); cartModQty(1); }
    if (e.key === "-")         { e.preventDefault(); cartModQty(-1); }
    if (e.key === "Enter")     { e.preventDefault(); enterCheckout(); }
  } else if (p === "CouponSquarePage") {
    const list = getFilteredCoupons();
    if (e.key === "ArrowDown") { e.preventDefault(); app.couponSquare.selectedIdx = Math.min(Math.max(0, list.length - 1), app.couponSquare.selectedIdx + 1); render(); }
    if (e.key === "ArrowUp")   { e.preventDefault(); app.couponSquare.selectedIdx = Math.max(0, app.couponSquare.selectedIdx - 1); render(); }
    if (e.key === "Enter")     { e.preventDefault(); claimOrBuySingle(); }
  }
});

resetAll();
</script>
</body>
</html>
